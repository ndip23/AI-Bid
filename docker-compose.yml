version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_bid_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: aibidcopilot
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai_bid_redis
    restart: always
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: ai_bid_backend
    restart: always
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgrespassword2026@postgres:5432/aibidcopilot?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ai-bid-copilot-jwt-super-secret-key-2026
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: ai_bid_frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
